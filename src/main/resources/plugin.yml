
name: VortexUtility
version: '${version}'
main: id.vortexutility.VortexUtility
api-version: '26.3'
author: VortexNetwork
description: Optimized RTP and Custom Ender Chest

commands:
  vortexutility:
    description: VortexUtility administration
    aliases: [vu]
    usage: /vu reload
    permission: vortexutility.admin

  rtp:
    description: Open RTP GUI
    usage: /rtp
    permission: vortexutility.rtp

  ec:
    description: Open Custom Ender Chest
    aliases: [enderchest]
    usage: /ec
    permission: vortexutility.ec

permissions:
  vortexutility.admin:
    description: VortexUtility administrator
    default: op
    children:
      vortexutility.rtp: true
      vortexutility.ec: true
      vortexutility.ec.1: true
      vortexutility.ec.2: true
      vortexutility.ec.3: true
      vortexutility.ec.4: true
      vortexutility.ec.5: true
      vortexutility.ec.6: true

  vortexutility.rtp:
    default: true

  vortexutility.ec:
    default: true

  vortexutility.ec.1:
    default: true

  vortexutility.ec.2:
    default: false

  vortexutility.ec.3:
    default: false

  vortexutility.ec.4:
    default: false

  vortexutility.ec.5:
    default: false

  vortexutility.ec.6:
    default: false
